name: Probe real estate sources (temporary)
on:
  push:
    branches: [claude/project-thread-o4zdhp]
    paths: ["scripts/probe_tmp.py", ".github/workflows/probe-tmp.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance pandas requests lxml
      - env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/probe_tmp.py 2>&1 | grep -v "^$"
