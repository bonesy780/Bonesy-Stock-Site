name: Probe real estate sources (temporary)
on:
  push:
    branches: [claude/project-thread-o4zdhp]
    paths: ["scripts/build_re_invest.py", ".github/workflows/probe-tmp.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          timeout 15m python -u scripts/build_re_invest.py || true
          echo "=====JSON====="
          cat site/re/invest.json || true
          echo
          echo "=====END====="
          mkdir -p out && cp site/re/invest.json out/ || true
          for f in data.json hist.json; do curl -sf "https://www.topticker.ca/re/$f" -o "out/$f" || true; done
          ls -la out
          tar -czf - -C out . | base64 -w 0 > out.b64; echo; echo "=====B64====="; cat out.b64; echo; echo "=====B64END====="
