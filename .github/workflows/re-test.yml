name: TEMP real estate data test
on:
  push:
    branches: [claude/project-thread-k9rc46]
    paths: ["scripts/build_realestate.py", ".github/workflows/re-test.yml"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -u scripts/build_realestate.py
      - name: Save the output for review
        run: |
          mkdir -p re-test-output && cp -r site/re/*.json site/re/hist re-test-output/ && rm -f re-test-output/hist/us-[n-z]*.json re-test-output/hist/us-[d-m]*.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f re-test-output
          git commit -m "TEMP: real estate test output" && git pull --rebase -q origin claude/project-thread-k9rc46 && git push
