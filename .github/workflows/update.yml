name: Update data and deploy

on:
  schedule:
    # Times are UTC. The two full refreshes rebuild everything (about 20 minutes):
    - cron: "30 22 * * 1-5"   # weekdays after the US close
    - cron: "0 12 * * 0"      # Sunday refresh for the week-ahead watchlist
    # Quick refresh every 15 minutes (a couple of minutes each): stock news, housing news, and prices while
    # Asian or North American markets are open. Off the hour, when GitHub's scheduler is least busy.
    # GitHub often runs these late or skips them for hours, so each run also starts the next one itself
    # (the "next" job below); the schedule only restarts that chain if it ever stops.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full rebuilds everything; quick refreshes news (and prices in market hours)"
        type: choice
        options: [full, quick]
        default: full
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "worker/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

# One run at a time, so two runs never fetch RentCast listings or save data together. A run that starts while
# another is going waits; if a third arrives, the older waiting one is dropped (the newer one covers it).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fingerprint the build scripts
        id: code
        run: echo "hash=${{ hashFiles('scripts/**', 'requirements.txt', '.github/workflows/update.yml') }}" >> "$GITHUB_OUTPUT"
      - name: Bring back the data the last run built
        # Built data is not in the repo, so a quick run starts from what the last run saved here and only
        # refreshes the fast-changing parts. A full run starts from it too, so a step that fails keeps the old data.
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: .data-cache
          key: site-data-v1-${{ steps.code.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            site-data-v1-${{ steps.code.outputs.hash }}-
            site-data-v1-
      - name: Decide how much to rebuild
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          ASKED: ${{ inputs.mode }}
          MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
          CODE: ${{ steps.code.outputs.hash }}
        run: |
          [ -f .data-cache/site.tar ] && tar -xf .data-cache/site.tar
          last=$(cat .data-cache/last-full 2>/dev/null || echo 0)
          full=true
          if [ "$EVENT" = schedule ] && [ "$SCHEDULE" != "30 22 * * 1-5" ] && [ "$SCHEDULE" != "0 12 * * 0" ] || [ "$ASKED" = quick ]; then
            # A quick run still does everything when the saved data is from older scripts (a change was merged
            # but its full run was dropped) or when no full refresh has finished in 26 hours.
            if [[ "$MATCHED" != "site-data-v1-$CODE-"* ]]; then echo "Saved data is from older scripts, doing a full run"
            elif [ $(( $(date -u +%s) - last )) -gt 93600 ]; then echo "No full refresh in 26 hours, doing a full run"
            else full=false
            fi
          fi
          # Prices in quick runs while markets are open, Monday to Friday (UTC): Tokyo, Seoul and Taipei
          # 00:00 to 07:15, Toronto and New York 13:15 to 21:15 (covers both summer and winter time).
          hm=$((10#$(date -u +%H%M)))
          prices=false
          if [ "$full" = false ] && [ "$(date -u +%u)" -le 5 ] && { [ $hm -le 715 ] || { [ $hm -ge 1315 ] && [ $hm -le 2115 ]; }; }; then
            prices=true
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "prices=$prices" >> "$GITHUB_OUTPUT"
          echo "Full rebuild: $full. Price refresh: $prices."
      - name: Gather prices and rank the top stocks
        if: steps.mode.outputs.full == 'true' || steps.mode.outputs.prices == 'true'
        env:
          FAST: ${{ steps.mode.outputs.full == 'true' && '0' || '1' }}
        # A quick price refresh that fails keeps the last prices; a full run that fails stops here as before
        run: python scripts/build_data.py || { [ "$FAST" = 1 ] && echo "::warning::price refresh failed, keeping the last prices"; }
      - name: Gather market news
        run: python scripts/build_news.py || echo "::warning::news step failed, deploying without fresh news"
      - name: Gather housing news
        if: steps.mode.outputs.full != 'true'
        run: python scripts/build_realestate.py --news-only || echo "::warning::housing news step failed, keeping the last headlines"
      - name: Gather the day's headlines for the Daily News page
        run: python scripts/build_daily_news.py || echo "::warning::daily news step failed, keeping the last headlines"
      - name: Add new IPOs so they can be looked up the day they list
        run: python scripts/build_ipos.py || echo "::warning::IPO step failed, new listings wait for the live search"
      - name: Save price history for the stock lookup page
        if: steps.mode.outputs.full == 'true'
        run: python scripts/build_history.py || echo "::warning::history step failed, stock lookup may be stale"
      - name: Gather facts on every stock for the screener, watchlists and other tools
        if: steps.mode.outputs.full == 'true'
        run: python scripts/build_market.py || echo "::warning::market facts step failed, tool pages may be stale"
      - name: Gather which analyst firms rate each stock
        if: steps.mode.outputs.full == 'true'
        run: python scripts/build_ratings.py || echo "::warning::analyst history step failed, stock pages will skip it"
      - name: Use the latest saved listings and RentCast request log from main
        if: steps.mode.outputs.full == 'true'
        # This run may have checked out an older commit than main (runs queue one after another), so take
        # the newest log, or a second run could fetch again before the first run's log reached it.
        run: |
          git fetch -q origin main
          for f in listings.json rentcast_usage.json; do
            git show "origin/main:data/realestate/$f" > "/tmp/$f" 2>/dev/null && mv "/tmp/$f" "data/realestate/$f" || true
          done
      - name: Gather housing market data and listings for the real estate pages
        if: steps.mode.outputs.full == 'true'
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/build_realestate.py || echo "::warning::real estate step failed, real estate pages may be stale"
      - name: Give the live service the Ask page's notes
        run: cp site/ask-kb.json worker/ask-kb.json
      - name: Deploy the live price service
        id: worker
        if: steps.mode.outputs.full == 'true' && env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
      - name: Switch on Claude answers for the Ask page
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: env.ANTHROPIC_KEY != '' && env.CF_TOKEN != '' && env.CF_ACCOUNT != '' && steps.worker.outcome == 'success'
        continue-on-error: true
        working-directory: worker
        run: printf '%s' "$ANTHROPIC_KEY" | npx --yes wrangler secret put ANTHROPIC_API_KEY
      - name: Point the site at the live price service
        env:
          LIVE_API_URL: ${{ vars.LIVE_API_URL }}
          DEPLOYED_URL: ${{ steps.worker.outputs.deployment-url }}
        run: |
          url="${LIVE_API_URL:-$DEPLOYED_URL}"
          if [ -z "$url" ] && [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            sub=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty') || true
            [ -n "$sub" ] && url="https://market-leaders-live.$sub.workers.dev"
          fi
          url="${url%/}"
          if [ -n "$url" ]; then
            sed -i "s#__LIVE_API__#$url#" site/live.js
            echo "Live prices from $url"
          else
            echo "::notice::No live price service set up yet, so the site shows the saved prices. See README."
          fi
      - name: Keep this run's data for the next run
        run: |
          mkdir -p .data-cache
          git ls-files -z --others --ignored --exclude-standard site | tar --null -cf .data-cache/site.tar -T -
          [ "${{ steps.mode.outputs.full }}" = true ] && date -u +%s > .data-cache/last-full
          du -sh .data-cache
      - uses: actions/cache/save@v4
        with:
          path: .data-cache
          key: site-data-v1-${{ steps.code.outputs.hash }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: List every page, stock and housing market for search engines
        run: python scripts/build_sitemap.py || echo "::warning::sitemap step failed, keeping the short sitemap"
      - name: Add search engine ownership tags
        # Optional repository variables (Settings > Secrets and variables > Actions > Variables):
        # GOOGLE_SITE_VERIFICATION and BING_SITE_VERIFICATION hold the code from each tool's "HTML tag" method.
        env:
          GOOGLE_CODE: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_CODE: ${{ vars.BING_SITE_VERIFICATION }}
        run: |
          tags=""
          [ -n "$GOOGLE_CODE" ] && tags="$tags<meta name=\"google-site-verification\" content=\"${GOOGLE_CODE//[^A-Za-z0-9_-]/}\">"
          [ -n "$BING_CODE" ] && tags="$tags<meta name=\"msvalidate.01\" content=\"${BING_CODE//[^A-Za-z0-9_-]/}\">"
          [ -n "$tags" ] && sed -i "s#<!-- site-verification -->#$tags#" site/index.html || true
      - name: Bust browser cache for CSS and JS
        run: sed -i "s/__V__/${GITHUB_SHA::7}/g" site/*.html site/re/*.html site/daily/*.html
      - name: Save refreshed member lists and this week's listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/constituents
          [ -f data/listings.csv ] && git add data/listings.csv
          [ -f data/realestate/listings.json ] && git add data/realestate/listings.json
          [ -f data/realestate/rentcast_usage.json ] && git add data/realestate/rentcast_usage.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Refresh index member lists"
          # main may have moved during the build. Put the commit on top of main in a separate folder, so the
          # site being deployed is never touched: pulling here once merged newer pages into this build and
          # left conflict markers in them. If another run saved the same lists meanwhile, this run's (newer) lists win.
          C=$(git rev-parse HEAD)
          for i in 1 2 3; do
            git fetch -q origin main
            rm -rf /tmp/save && git worktree add -q --detach /tmp/save origin/main
            if (cd /tmp/save && git cherry-pick -X theirs "$C" >/dev/null && git push -q origin HEAD:main); then
              git worktree remove --force /tmp/save; exit 0
            fi
            (cd /tmp/save && git cherry-pick --abort 2>/dev/null || true)
            git worktree remove --force /tmp/save
            sleep 5
          done
          echo "::warning::could not save the refreshed member lists this run"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub's scheduler is unreliable (on Nov 17 it skipped every run for almost seven hours), so the news went
  # stale. Each run waits until about 15 minutes after it started, then starts a quick run itself, unless
  # another run is already waiting (such as the evening full refresh), which then carries the chain on.
  next:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Start the next quick refresh about 15 minutes after this one started
        run: |
          started=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          wait=$(( $(date -u -d "$started" +%s) + 14 * 60 - $(date -u +%s) ))
          [ $wait -gt 0 ] && { echo "Waiting $wait seconds"; sleep $wait; }
          others=$(gh run list --repo "$REPO" --workflow update.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.status != \"completed\" and .databaseId != $GITHUB_RUN_ID)] | length")
          if [ "$others" -gt 0 ]; then
            echo "Another run is already queued or running, it will keep the news fresh"
          else
            gh workflow run update.yml --repo "$REPO" --ref main -f mode=quick && echo "Started the next quick refresh"
          fi
