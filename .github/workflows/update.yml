name: Update data and deploy

on:
  schedule:
    - cron: "30 22 * * 1-5"   # weekdays after the US close
    - cron: "0 12 * * 0"      # Sunday refresh for the week-ahead watchlist
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "worker/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build_data.py
      - name: Gather market news
        run: python scripts/build_news.py || echo "::warning::news step failed, deploying without fresh news"
      - name: Save price history for the stock lookup page
        run: python scripts/build_history.py || echo "::warning::history step failed, stock lookup may be stale"
      - name: Gather facts on every stock for the screener, watchlists and other tools
        run: python scripts/build_market.py || echo "::warning::market facts step failed, tool pages may be stale"
      - name: Gather which analyst firms rate each stock
        run: python scripts/build_ratings.py || echo "::warning::analyst history step failed, stock pages will skip it"
      - name: Give the live service the Ask page's notes
        run: cp site/ask-kb.json worker/ask-kb.json
      - name: Deploy the live price service
        id: worker
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
      - name: Switch on Claude answers for the Ask page
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: env.ANTHROPIC_KEY != '' && env.CF_TOKEN != '' && env.CF_ACCOUNT != '' && steps.worker.outcome == 'success'
        continue-on-error: true
        working-directory: worker
        run: printf '%s' "$ANTHROPIC_KEY" | npx --yes wrangler secret put ANTHROPIC_API_KEY
      - name: Point the site at the live price service
        env:
          LIVE_API_URL: ${{ vars.LIVE_API_URL }}
          DEPLOYED_URL: ${{ steps.worker.outputs.deployment-url }}
        run: |
          url="${LIVE_API_URL:-$DEPLOYED_URL}"
          if [ -z "$url" ] && [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            sub=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty') || true
            [ -n "$sub" ] && url="https://market-leaders-live.$sub.workers.dev"
          fi
          url="${url%/}"
          if [ -n "$url" ]; then
            sed -i "s#__LIVE_API__#$url#" site/live.js
            echo "Live prices from $url"
          else
            echo "::notice::No live price service set up yet, so the site shows the saved prices. See README."
          fi
      - name: Bust browser cache for CSS and JS
        run: sed -i "s/__V__/${GITHUB_SHA::7}/g" site/*.html
      - name: Save refreshed member lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/constituents
          git diff --cached --quiet && exit 0
          git commit -m "Refresh index member lists"
          # main may have moved during the build; rebase and retry, and never hold up the deploy
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin main && git push && exit 0
            sleep 5
          done
          echo "::warning::could not save the refreshed member lists this run"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
